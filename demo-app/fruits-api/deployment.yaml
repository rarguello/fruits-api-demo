apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruits-api
  labels:
    app: fruits-api
    app.kubernetes.io/part-of: fruits-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fruits-api
  template:
    metadata:
      labels:
        app: fruits-api
    spec:
      containers:
        - name: fruits-api
          image: quay.io/daytwo/fruits-api:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # La demo usa /fruits y la UI /, que son públicos.
            # Desactivamos OIDC para no depender del SSO del cliente.
            - name: QUARKUS_OIDC_TENANT_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
