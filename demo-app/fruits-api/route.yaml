apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fruits-api
  labels:
    app: fruits-api
    app.kubernetes.io/part-of: fruits-api-demo
spec:
  to:
    kind: Service
    name: fruits-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
